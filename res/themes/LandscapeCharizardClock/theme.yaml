---
author: "Custom"

display:
  DISPLAY_SIZE: '3.5"'
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 90, 0 # Charizard fiery orange LED

# Dynamic Time-of-Day Skies (Alba, Giorno, Pomeriggio, Sera, Notte)
day_phases:
  ENABLED: true
  ALBA:
    START_HOUR: 6
    END_HOUR: 9
    IMAGE: bg_alba.png
    RGB_LED: 255, 140, 90
  GIORNO:
    START_HOUR: 9
    END_HOUR: 16
    IMAGE: bg_giorno.png
    RGB_LED: 255, 210, 110
  POMERIGGIO:
    START_HOUR: 16
    END_HOUR: 19
    IMAGE: bg_pomeriggio.png
    RGB_LED: 255, 120, 20
  SERA:
    START_HOUR: 19
    END_HOUR: 22
    IMAGE: bg_sera.png
    RGB_LED: 255, 80, 0
  NOTTE:
    START_HOUR: 22
    END_HOUR: 6
    IMAGE: bg_notte.png
    RGB_LED: 50, 100, 240

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

clock_layout:
  # Digital Time
  TIME:
    SHOW: true
    X: 350
    Y: 25
    FONT: digital/DIGITAL-7.TTF
    FONT_SIZE: 62
    FONT_COLOR: 255, 245, 220 # Bright warm white glow
    BACKGROUND_IMAGE: background.png
    ALIGN: center
    ANCHOR: ma
    SHOW_SECONDS: true

  # Date display
  DATE:
    SHOW: true
    X: 350
    Y: 96
    FONT: roboto/Roboto-Bold.ttf
    FONT_SIZE: 15
    FONT_COLOR: 255, 235, 190 # Clear warm amber-white
    BACKGROUND_IMAGE: background.png
    ALIGN: center
    ANCHOR: ma

  # Animated Tail Flame (Seamless 6-frame flame dynamics, 0 border artifacts)
  FLAME_ANIMATION:
    SHOW: true
    X: 15
    Y: 135
    WIDTH: 60
    HEIGHT: 70
    FRAMES_DIR: "flame"
    NUM_FRAMES: 6
